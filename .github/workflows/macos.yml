name: macOS Universal Viewer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          brew install cmake pkgconf gettext meson ninja nasm texinfo dylibbundler
      - uses: actions/cache@v6
        id: dependencies
        with:
          path: macos-deps
          key: macos13-${{ matrix.arch }}-${{ hashFiles('.github/scripts/macos-dependencies.json', '.github/scripts/build-macos-dependencies.py') }}
      - name: Build runtime dependencies for macOS 13
        if: steps.dependencies.outputs.cache-hit != 'true'
        run: |
          export PATH="$(brew --prefix gettext)/bin:$(brew --prefix texinfo)/bin:$PATH"
          python3 .github/scripts/build-macos-dependencies.py "$PWD/macos-deps" ${{ matrix.arch }}
      - name: Configure
        run: |
          export PATH="$PWD/macos-deps/bin:$(brew --prefix gettext)/bin:$PATH"
          export PKG_CONFIG_LIBDIR="$PWD/macos-deps/lib/pkgconfig"
          export PKG_CONFIG_PATH="$PKG_CONFIG_LIBDIR"
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DCMAKE_PREFIX_PATH="$PWD/macos-deps" \
            -DCMAKE_IGNORE_PREFIX_PATH="$(brew --prefix)" \
            -DPKG_CONFIG_EXECUTABLE="$(command -v pkg-config)" \
            -DGETTEXT_MSGFMT_EXECUTABLE="$(brew --prefix gettext)/bin/msgfmt" \
            -DGETTEXT_MSGMERGE_EXECUTABLE="$(brew --prefix gettext)/bin/msgmerge" \
            -DBUILD_VIEWER=ON \
            -DBUILD_JAVA=OFF \
            -DENABLE_NLS=ON \
            -DENABLE_H264=OFF \
            -DENABLE_AUDIO=OFF \
            -DENABLE_GNUTLS=ON \
            -DENABLE_NETTLE=ON \
            -DMACOS_BUNDLE_LIBRARIES=ON
          test -f build/tests/unit/CTestTestfile.cmake
      - name: Build
        run: cmake --build build --parallel 3
      - name: Test
        run: ctest --test-dir build/tests/unit --output-on-failure --output-junit test-results.xml
      - name: Verify architecture
        run: lipo build/vncviewer/vncviewer -verify_arch ${{ matrix.arch }}
      - name: Package standalone app
        run: |
          cmake --build build --target dmg
          mkdir mounted
          hdiutil attach build/release/TigerVNC-*.dmg -mountpoint "$PWD/mounted" -nobrowse -readonly
          tar -czf build/TigerVNC-${{ matrix.arch }}.tar.gz -C mounted TigerVNC.app LICENCE.TXT README.rst
          hdiutil detach "$PWD/mounted"
      - uses: actions/upload-artifact@v7
        with:
          name: app-macos-${{ matrix.arch }}
          path: build/TigerVNC-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-macos-${{ matrix.arch }}
          path: build/tests/unit/test-results.xml

  universal:
    name: Universal DMG
    needs: build
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: app-macos-*
          path: native
          merge-multiple: true
      - name: Merge and verify Universal app
        run: |
          mkdir intel arm universal
          tar -xzf native/TigerVNC-x86_64.tar.gz -C intel
          tar -xzf native/TigerVNC-arm64.tar.gz -C arm
          python3 .github/scripts/merge-macos-apps.py intel/TigerVNC.app arm/TigerVNC.app universal/TigerVNC.app
          cp LICENCE.TXT README.rst universal/
          ln -s /Applications universal/Applications
      - name: Package Universal DMG
        run: |
          hdiutil create -fs HFS+ -format UDZO -volname TigerVNC-SOCKS5 \
            -srcfolder universal TigerVNC-SOCKS5-universal.dmg
          shasum -a 256 TigerVNC-SOCKS5-universal.dmg > TigerVNC-SOCKS5-universal.dmg.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: TigerVNC-macOS-universal
          path: |
            TigerVNC-SOCKS5-universal.dmg
            TigerVNC-SOCKS5-universal.dmg.sha256
          if-no-files-found: error
